{{ define "main" }}
<header class="home-header">
  <h1><span class="prompt">prdpx7@blog:~ $</span> whoami</h1>
  <p>Hobbyist Engineer.</p>
</header>

<hr>

<section>
  <h2>Find me</h2>
  <ul>
    <li><a href="https://twitter.com/prdpx7" target="_blank" rel="noopener noreferrer">Twitter</a></li>
    <li><a href="https://github.com/prdpx7" target="_blank" rel="noopener noreferrer">GitHub</a></li>
  </ul>
</section>

<hr>

<section>
  <h2>Writing</h2>
  <ul class="post-list">
    {{ range (where .Site.RegularPages "Section" "posts") }}
    <li>
      <span class="date">{{ .Date.Format "2006-01-02" }}</span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</section>

<p class="pager" data-pager="home">
  <span class="prompt">prdpx7@blog:~ $</span>
  <a href="/about/" class="pager-cmd" accesskey="m">more</a><span class="blink">_</span>
  <span class="pager-hint c">&nbsp;# press <kbd>m</kbd></span>
</p>
{{ end }}
